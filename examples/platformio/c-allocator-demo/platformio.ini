; C_Allocator PlatformIO example, also the board build matrix.
;
;   pio run                          build every board below
;   pio run -e esp32dev              build one board
;   pio run -e esp32dev -t upload -t monitor
;   pio run -e native -t exec        build and run on the desktop
;
; Copying this example into your own project? Change lib_deps to
;   lib_deps = endurodave/C_Allocator@^2.1.0
; (here it points at this repository so every commit is tested).

[env]
lib_deps = symlink://../../..
monitor_speed = 115200

; ESP32 (Xtensa, FreeRTOS): std::mutex is available, so the allocators lock with it
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ESP32-C3 (RISC-V, FreeRTOS)
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; STM32 Nucleo-F401RE (Cortex-M4, bare metal): no std::mutex, so no lock
; (single-threaded). With an RTOS, add e.g. -DALLOC_LOCK_FREERTOS.
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

; STM32F4 Discovery (STM32F407VG Cortex-M4, FreeRTOS): two tasks share
; the allocators, locked by a FreeRTOS critical section (ALLOC_LOCK_FREERTOS).
; FreeRTOS comes from the STM32duino FreeRTOS library.
; Flashed over its ST-LINK/V2, which has no USB serial port: Serial goes to
; USART6 (TX PC6, RX PC7), 115200 8N1, through a 3.3 V USB-UART adapter.
[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = arduino
upload_protocol = stlink
lib_deps = ${env.lib_deps}
    stm32duino/STM32duino FreeRTOS@^10.3.2
; Only for this in-repo build; see freertos_path.py
extra_scripts = pre:freertos_path.py
build_flags = -DALLOC_LOCK_FREERTOS
    -DSERIAL_UART_INSTANCE=6 -DPIN_SERIAL_TX=PC6 -DPIN_SERIAL_RX=PC7

; Raspberry Pi Pico (RP2040 Cortex-M0+, bare metal): no std::mutex, so no lock
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino

; Desktop (Linux, macOS, or Windows with MinGW): locks with std::mutex
[env:native]
platform = native
