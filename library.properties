sentence=Fixed block memory allocator in C: static pools, no heap, deterministic, with malloc/free style use.
paragraph=fb_allocator hands out fixed-size blocks from a static pool; x_allocator combines several pools into a malloc/free/realloc style API that picks the smallest block that fits. No heap fragmentation, constant-time allocation. Thread-safe on FreeRTOS, ThreadX, Zephyr and CMSIS-RTOS2 with a build option.
